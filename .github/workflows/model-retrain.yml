# ============================================================
# CIVA Platform — Model Retraining Pipeline
# Triggered weekly or on new attack signatures
# ============================================================

name: Model Retraining Pipeline

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force full retraining'
        required: false
        default: 'false'

env:
  AWS_REGION: us-east-1
  MODEL_BUCKET: civa-prod-models

permissions:
  contents: read
  id-token: write

jobs:
  retrain:
    name: Retrain Behavior Model
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: services/behavior-agent
        run: pip install -r requirements.txt

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Training Data
        run: |
          aws s3 cp s3://${{ env.MODEL_BUCKET }}/training-data/ \
            services/behavior-agent/training/ --recursive

      - name: Generate Augmented Data
        working-directory: services/behavior-agent
        run: python training/generate_synthetic.py

      - name: Train Model
        working-directory: services/behavior-agent
        run: python training/train_model.py

      - name: Validate Model Performance
        working-directory: services/behavior-agent
        run: |
          python -c "
          import pickle
          with open('models/isolation_forest.pkl', 'rb') as f:
              checkpoint = pickle.load(f)
          metrics = checkpoint['metrics']
          print(f'F1: {metrics[\"f1\"]:.4f}')
          print(f'AUC: {metrics[\"auc_roc\"]:.4f}')
          print(f'p99 Latency: {metrics[\"latency_p99_ms\"]:.3f}ms')
          assert metrics['f1'] > 0.70, f'F1 score {metrics[\"f1\"]} below threshold 0.70'
          assert metrics['latency_p99_ms'] < 15, f'Latency {metrics[\"latency_p99_ms\"]}ms exceeds 15ms SLA'
          print('✅ Model validation passed')
          "

      - name: Upload Model to S3
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          aws s3 cp services/behavior-agent/models/isolation_forest.pkl \
            s3://${{ env.MODEL_BUCKET }}/models/isolation_forest_${VERSION}.pkl
          aws s3 cp services/behavior-agent/models/isolation_forest.pkl \
            s3://${{ env.MODEL_BUCKET }}/models/isolation_forest_latest.pkl

      - name: Update SageMaker Endpoint
        if: success()
        run: |
          echo "SageMaker endpoint update would be triggered here"
          # aws sagemaker update-endpoint ...

      - name: Notify Team
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Model Retraining ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*CIVA Model Retraining*\n*Status:* ${{ job.status }}\n*Trigger:* ${{ github.event_name }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
