# CIVA Platform — Docker Compose (Simplified for Fast Development)
version: '3.9'

services:
  # ---- Redis (Session State) ----
  redis:
    image: redis:7-alpine
    container_name: civa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- TimescaleDB (Time-Series Events) ----
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: civa-timescaledb
    environment:
      POSTGRES_USER: civa
      POSTGRES_PASSWORD: civa_secret
      POSTGRES_DB: civa_behavior
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - civa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civa"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Kafka (Single Broker - Simplified) ----
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: civa-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Zookeeper (Kafka Coordination) ----
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: civa-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Prometheus (Metrics Collection) ----
  prometheus:
    image: prom/prometheus:latest
    container_name: civa-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Grafana (Dashboards & Visualization) ----
  grafana:
    image: grafana/grafana:latest
    container_name: civa-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Behavior Agent (ML Anomaly Detection) ----
  behavior-agent:
    build:
      context: ./services/behavior-agent
      dockerfile: Dockerfile
    container_name: civa-behavior-agent
    environment:
      PORT: 8002
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: 5432
      TIMESCALEDB_USER: civa
      TIMESCALEDB_PASSWORD: civa_secret
      TIMESCALEDB_DATABASE: civa_behavior
      LOG_LEVEL: INFO
    ports:
      - "8002:8002"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Orchestrator (Policy Engine) ----
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: civa-orchestrator
    environment:
      PORT: 8003
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    ports:
      - "8003:8003"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Deception Agent (Honeypots) ----
  deception-agent:
    build:
      context: ./services/deception-agent
      dockerfile: Dockerfile
    container_name: civa-deception-agent
    environment:
      PORT: 8004
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: INFO
    ports:
      - "8004:8004"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Threat Intel (NLP Classification) ----
  threat-intel:
    build:
      context: ./services/threat-intel
      dockerfile: Dockerfile
    container_name: civa-threat-intel
    environment:
      PORT: 8005
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: INFO
    ports:
      - "8005:8005"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Frontend Dashboard (Web Interface) ----
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: civa-frontend
    environment:
      BEHAVIOR_AGENT_URL: http://behavior-agent:8002
      ORCHESTRATOR_URL: http://orchestrator:8003
      DECEPTION_AGENT_URL: http://deception-agent:8004
      THREAT_INTEL_URL: http://threat-intel:8005
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "8000:8000"
    depends_on:
      behavior-agent:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    volumes:
      - ./figma\ frontend:/civa/figma\ frontend:ro
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  civa-network:
    driver: bridge

volumes:
  redis-data:
  timescaledb-data:
  prometheus-data:
  grafana-data:
