# ============================================================
# CIVA Platform — Docker Compose (Local Development)
# ============================================================
version: '3.9'

x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
  REDIS_URL: redis://redis:6379/0
  TIMESCALEDB_HOST: timescaledb
  TIMESCALEDB_PORT: 5432
  TIMESCALEDB_USER: civa
  TIMESCALEDB_PASSWORD: civa_secret
  TIMESCALEDB_DATABASE: civa_behavior
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

services:
  # ---- Kafka Cluster (3 brokers via KRaft) ----
  kafka-1:
    image: confluentinc/cp-kafka:7.6.0
    container_name: civa-kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: 'CIVA-Kafka-Cluster-001'
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-2:
    image: confluentinc/cp-kafka:7.6.0
    container_name: civa-kafka-2
    hostname: kafka-2
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      CLUSTER_ID: 'CIVA-Kafka-Cluster-001'
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks:
      - civa-network
    depends_on:
      kafka-1:
        condition: service_healthy

  kafka-3:
    image: confluentinc/cp-kafka:7.6.0
    container_name: civa-kafka-3
    hostname: kafka-3
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      CLUSTER_ID: 'CIVA-Kafka-Cluster-001'
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks:
      - civa-network
    depends_on:
      kafka-1:
        condition: service_healthy

  # ---- Kafka Topic Init ----
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: civa-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating CIVA Kafka topics...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:29092 --topic session.events --partitions 12 --replication-factor 3 --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:29092 --topic risk.scores --partitions 12 --replication-factor 3 --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:29092 --topic action.commands --partitions 12 --replication-factor 3 --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:29092 --topic deception.events --partitions 12 --replication-factor 3 --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:29092 --topic threat.intel --partitions 12 --replication-factor 3 --config retention.ms=604800000
      echo 'All topics created successfully.'
      kafka-topics --list --bootstrap-server kafka-1:29092
      "
    networks:
      - civa-network

  # ---- Schema Registry ----
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: civa-schema-registry
    hostname: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      kafka-1:
        condition: service_healthy
    networks:
      - civa-network

  # ---- Redis (Session State) ----
  redis:
    image: redis:7.2-alpine
    container_name: civa-redis
    hostname: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - civa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- TimescaleDB (Behavioral History) ----
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: civa-timescaledb
    hostname: timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: civa
      POSTGRES_PASSWORD: civa_secret
      POSTGRES_DB: civa_behavior
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - civa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civa -d civa_behavior"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Sentinel SDK ----
  sentinel:
    build:
      context: ./services/sentinel-sdk
      dockerfile: Dockerfile
    container_name: civa-sentinel
    hostname: sentinel
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      SENTINEL_PORT: 8001
      SENTINEL_LOG_LEVEL: debug
    depends_on:
      kafka-1:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - civa-network

  # ---- Behavior Agent ----
  behavior-agent:
    build:
      context: .
      dockerfile: ./services/behavior-agent/Dockerfile
    container_name: civa-behavior-agent
    hostname: behavior-agent
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
      BEHAVIOR_AGENT_PORT: 8002
      BEHAVIOR_MODEL_PATH: /app/models/isolation_forest.pkl
    depends_on:
      kafka-1:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - civa-network

  # ---- Orchestrator ----
  orchestrator:
    build:
      context: .
      dockerfile: ./services/orchestrator/Dockerfile
    container_name: civa-orchestrator
    hostname: orchestrator
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
      ORCHESTRATOR_PORT: 8003
      PAGERDUTY_ENABLED: "false"
    depends_on:
      kafka-1:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - civa-network

  # ---- Deception Agent ----
  deception-agent:
    build:
      context: .
      dockerfile: ./services/deception-agent/Dockerfile
    container_name: civa-deception-agent
    hostname: deception-agent
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
      DECEPTION_AGENT_PORT: 8004
      S3_FORENSIC_BUCKET: civa-forensics
    depends_on:
      kafka-1:
        condition: service_healthy
    networks:
      - civa-network

  # ---- Threat Intel ----
  threat-intel:
    build:
      context: .
      dockerfile: ./services/threat-intel/Dockerfile
    container_name: civa-threat-intel
    hostname: threat-intel
    ports:
      - "8005:8005"
    environment:
      <<: *common-env
      THREAT_INTEL_PORT: 8005
    depends_on:
      kafka-1:
        condition: service_healthy
    networks:
      - civa-network

  # ---- Monitoring: Prometheus ----
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: civa-prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus-data:/prometheus
    networks:
      - civa-network

  # ---- Monitoring: Grafana ----
  grafana:
    image: grafana/grafana:10.4.0
    container_name: civa-grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - civa-network

  # ---- Distributed Tracing: Jaeger ----
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: civa-jaeger
    hostname: jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - civa-network

  # ---- Elasticsearch (SIEM) ----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: civa-elasticsearch
    hostname: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - civa-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  redis-data:
  timescaledb-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:

networks:
  civa-network:
    driver: bridge
    name: civa-network
