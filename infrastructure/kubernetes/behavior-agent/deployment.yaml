apiVersion: apps/v1
kind: Deployment
metadata:
  name: behavior-agent
  namespace: civa
  labels:
    app: behavior-agent
    version: v1
    tier: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: behavior-agent
  template:
    metadata:
      labels:
        app: behavior-agent
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      containers:
        - name: behavior-agent
          image: civa/behavior-agent:latest
          ports:
            - containerPort: 8002
          env:
            - name: BEHAVIOR_AGENT_PORT
              value: "8002"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: civa-config
                  key: kafka.bootstrap.servers
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: civa-secrets
                  key: redis.url
            - name: TIMESCALEDB_HOST
              valueFrom:
                configMapKeyRef:
                  name: civa-config
                  key: timescaledb.host
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: behavior-model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: behavior-agent
  namespace: civa
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: behavior-agent
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: behavior-agent
  namespace: civa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: behavior-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
