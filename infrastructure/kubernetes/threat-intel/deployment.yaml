apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-intel
  namespace: civa
  labels:
    app: threat-intel
    version: v1
    tier: intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: threat-intel
  template:
    metadata:
      labels:
        app: threat-intel
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
    spec:
      containers:
        - name: threat-intel
          image: civa/threat-intel:latest
          ports:
            - containerPort: 8005
          env:
            - name: THREAT_INTEL_PORT
              value: "8005"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: civa-config
                  key: kafka.bootstrap.servers
            - name: ELASTIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: civa-config
                  key: elastic.host
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: threat-intel
  namespace: civa
spec:
  type: ClusterIP
  ports:
    - port: 8005
      targetPort: 8005
      name: http
  selector:
    app: threat-intel
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: threat-intel
  namespace: civa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: threat-intel
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
